# Drop-in for libvirt-guests.service, installed by scripts/setup-vm-state.sh as
# /etc/systemd/system/libvirt-guests.service.d/50-dotfiles.conf.
#
# Why: the vendor unit orders itself only after the libvirt *sockets*, so at host
# shutdown systemd stopped libvirtd/virtlogd in parallel with the guest save.
# Measured: 2026-10-29 libvirtd was gone first ("Can't connect to qemu:///system.
# Skipping." — nothing saved); 2026-10-30 libvirtd stopped mid-save. The vendor
# unit also has TimeoutStopSec=0 (infinite): a managedsave that hung on
# 2026-10-30 kept the laptop from powering off for 8+ minutes.

[Unit]
# Units ordered After= are stopped *before* them at shutdown, so the daemons the
# save depends on stay up until libvirt-guests has finished.
After=libvirtd.service virtqemud.service virtlogd.service virtlockd.service

[Service]
# A normal save takes ~4–7 s; 180 s is a generous ceiling, not an expected time.
TimeoutStopSec=180
# Runs after every stop; acts only when the stop did not succeed (timeout/fail).
ExecStopPost=/usr/local/libexec/dotfiles-libvirt-guests-fallback
