[main]
font=JetBrainsMono Nerd Font:size=14

[cursor]
blink=no
unfocused-style=none

[tweak]
delayed-render-lower=1000000
delayed-render-upper=12000000
damage-whole-window=yes

[colors-dark]
background=1a1b26
foreground=c0caf5

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[scrollback]
# 1000 lines (the default) scrolls away during a single build log.
lines=10000
# There is no scrollbar in foot; this shows how far back you are instead.
indicator-position=relative
indicator-format=percentage

[key-bindings]
# foot binds only whole pages by default, and leaves line, half-page,
# top and bottom unbound. Keyboard-only scrolling needs all of them.
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-up-half-page=Control+Shift+Page_Up
scrollback-down-half-page=Control+Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End
